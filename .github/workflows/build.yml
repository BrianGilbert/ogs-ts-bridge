name: ci
# Build + test on every push/PR; pushes to main publish a CalVer release
# (ogs_ts_bridge-[YYYY.MM.DD]-win64.zip, self-contained GUI + console) —
# same handling as bepinex-ogs-ts / uevr-ogs-ts / ue4ss-ogs-ts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest   # WPF (net8.0-windows) + shared-memory sources
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Open-Game-Standards/OGS-Telemetry-Standard
          path: OGS-Telemetry-Standard
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Publish (self-contained win-x64)
        run: |
          dotnet publish src/OgsTsBridge    -c Release -r win-x64 --self-contained true -o dist
          dotnet publish src/OgsTsBridge.Gui -c Release -r win-x64 --self-contained true -o dist
          if (-not (Test-Path dist/OgsTsBridge.Gui.exe) -or -not (Test-Path dist/ogs-ts-bridge.exe)) {
            throw "executables missing from publish output"
          }
        shell: pwsh
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ogs-ts-bridge-dist
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ogs-ts-bridge-dist
      - name: CalVer tag
        id: calver
        shell: bash
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$base.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        shell: pwsh
        run: |
          $name = "ogs_ts_bridge-$($env:TAG.TrimStart('v'))-win64.zip"
          if (-not (Test-Path OgsTsBridge.Gui.exe) -or -not (Test-Path ogs-ts-bridge.exe)) {
            throw "executables missing from artifact"
          }
          Compress-Archive -Path 'OgsTsBridge.Gui.exe','ogs-ts-bridge.exe','*.dll','*.json' -DestinationPath $name
          "zip=$name" >> $env:GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.tag }}
          files: ${{ env.zip }}
          generate_release_notes: true
