name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test-release:
    runs-on: windows-latest   # WPF (net8.0-windows) + shared-memory sources
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish (self-contained win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish src/OgsaTsBridge -c Release -r win-x64 --self-contained true -o artifacts/release
          dotnet publish src/OgsaTsBridge.Gui -c Release -r win-x64 --self-contained true -o artifacts/release

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path artifacts/release/* -DestinationPath ogsa-ts-bridge-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ogsa-ts-bridge-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
